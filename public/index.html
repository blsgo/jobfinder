<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Seeker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23161618'/%3E%3Ctext x='16' y='21.5' font-family='Arial' font-weight='700' font-size='15' fill='%23fff' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6ecf4; --bg-a:#c9d6ea; --bg-b:#eef1f7; --bg-c:#b8c9e4;
  --ink:#0e1829; --ink-2:#465267; --ink-3:#8492a8; --line:rgba(14,24,41,.08);
  --glass-a:rgba(255,255,255,.62); --glass-b:rgba(255,255,255,.26);
  --glass-strong:rgba(255,255,255,.72); --rim:rgba(255,255,255,.95);
  --shadow:0 18px 50px -20px rgba(28,48,90,.35), 0 2px 6px -2px rgba(28,48,90,.08);
  --accent:#23408f; --accent-2:#5476f0; --accent-3:#9db1f7;
  --debt:#d8744a; --ok:#239a74; --warn:#c9892a;
  --chip:rgba(14,24,41,.06); --drawer:rgba(246,248,252,.94);
  color-scheme:light;
}
/* Dark = charcoal black, not navy */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0d0d0e; --bg-a:#1f1f22; --bg-b:#121213; --bg-c:#2a2a2e;
  --ink:#f1f1f2; --ink-2:#b3b3b8; --ink-3:#77777e; --line:rgba(255,255,255,.08);
  --glass-a:rgba(255,255,255,.08); --glass-b:rgba(255,255,255,.025);
  --glass-strong:rgba(255,255,255,.12); --rim:rgba(255,255,255,.22);
  --shadow:0 20px 60px -20px rgba(0,0,0,.75);
  --accent:#a9b8f5; --accent-2:#7d93ff; --accent-3:#3b3b42;
  --debt:#ef8e63; --ok:#3fc492; --warn:#e2a945;
  --chip:rgba(255,255,255,.07); --drawer:rgba(22,22,24,.96); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d0d0e; --bg-a:#1f1f22; --bg-b:#121213; --bg-c:#2a2a2e;
  --ink:#f1f1f2; --ink-2:#b3b3b8; --ink-3:#77777e; --line:rgba(255,255,255,.08);
  --glass-a:rgba(255,255,255,.08); --glass-b:rgba(255,255,255,.025);
  --glass-strong:rgba(255,255,255,.12); --rim:rgba(255,255,255,.22);
  --shadow:0 20px 60px -20px rgba(0,0,0,.75);
  --accent:#a9b8f5; --accent-2:#7d93ff; --accent-3:#3b3b42;
  --debt:#ef8e63; --ok:#3fc492; --warn:#e2a945;
  --chip:rgba(255,255,255,.07); --drawer:rgba(22,22,24,.96); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;font-size:14px;line-height:1.45}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* scene */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(1200px 700px at 80% -10%,var(--bg-b),transparent 60%),linear-gradient(180deg,var(--bg-b),var(--bg))}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.85;animation:drift 28s ease-in-out infinite alternate}
.b1{width:620px;height:620px;left:-140px;top:-120px;background:var(--bg-a)}
.b2{width:520px;height:520px;right:-120px;top:30%;background:var(--bg-c);animation-duration:34s}
.b3{width:700px;height:420px;left:30%;bottom:-200px;background:var(--bg-a);opacity:.6;animation-duration:40s}
.b4{width:260px;height:260px;left:52%;top:12%;background:var(--accent-3);opacity:.35;animation-duration:22s}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes drift{to{transform:translate3d(60px,40px,0) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

/* glass */
.glass{position:relative;border-radius:26px;background:linear-gradient(140deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(26px) saturate(175%);-webkit-backdrop-filter:blur(26px) saturate(175%);box-shadow:var(--shadow),inset 0 1px 0 var(--rim),inset 0 -1px 1px rgba(255,255,255,.06)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(150deg,var(--rim),rgba(255,255,255,.05) 38%,rgba(255,255,255,.02) 62%,var(--rim));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 45%)}
.glass:hover::after{opacity:1}

/* rail */
.rail{position:fixed;left:18px;top:18px;bottom:18px;width:68px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
.rail .logo{width:42px;height:42px;border-radius:14px;background:var(--ink);color:var(--bg-b);display:grid;place-items:center;font-weight:600;letter-spacing:-.02em;margin-bottom:10px}
.rail button{position:relative;width:44px;height:44px;border:0;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);background:transparent;cursor:pointer;transition:.2s}
.rail button:hover,.rail button.on{background:var(--glass-strong);color:var(--ink);box-shadow:inset 0 1px 0 var(--rim)}
.rail svg{width:20px;height:20px}
.rail .badge{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--debt);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center}
.rail .badge.n{background:var(--chip);color:var(--ink-2)}
.rail .sp{flex:1}

main{position:relative;z-index:1;padding:22px 26px 60px 112px;max-width:1440px;margin:0 auto}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:22px}
.pill{border-radius:18px;padding:12px 18px;display:inline-flex;align-items:center;gap:10px;justify-self:start}
.pill.tools{justify-self:end;padding:6px;gap:6px}
.pill b{font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.hero{text-align:center}
.hero .t{font-size:64px;font-weight:300;letter-spacing:-.04em;line-height:1}
.hero .t small{font-size:16px;letter-spacing:0;color:var(--ink-2);margin-left:6px;font-weight:400}
.hero .d{color:var(--ink-2);margin-top:6px}

.btn{border:0;height:34px;padding:0 14px;border-radius:11px;background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--rim),0 1px 2px rgba(0,0,0,.06);cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-1px)}
.btn.dark{background:var(--ink);color:var(--bg-b);box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink-2);padding:0 10px}
.btn.ghost:hover{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.4;pointer-events:none}
.iconbtn{height:38px;min-width:38px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:.2s}
.iconbtn:hover{background:var(--glass-strong);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}

/* KPIs */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;margin-bottom:18px}
.span-3{grid-column:span 3}.span-12{grid-column:span 12}
.kpi{padding:20px 22px;min-height:140px;display:flex;flex-direction:column}
.kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.kpi .lbl i{width:26px;height:26px;border-radius:9px;background:var(--glass-strong);display:grid;place-items:center;box-shadow:inset 0 1px 0 var(--rim)}
.kpi .lbl i svg{width:14px;height:14px}
.kpi .v{font-size:34px;font-weight:300;letter-spacing:-.035em;margin-top:14px;line-height:1.05}
.kpi .v small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:4px}
.kpi .foot{margin-top:auto;padding-top:12px;color:var(--ink-3);font-size:12.5px}

/* list card */
.card{padding:22px 24px}
.card-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
.card-h .sub{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.tools-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{height:34px;border:0;border-radius:11px;padding:0 12px;width:230px;background:var(--chip);outline:none;box-shadow:inset 0 0 0 1px transparent;transition:.15s}
.search:focus{background:var(--glass-strong);box-shadow:inset 0 0 0 1px var(--accent-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:0;height:28px;padding:0 11px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:.15s}
.chip.on{background:var(--ink);color:var(--bg-b)}
.chips .sep{width:1px;background:var(--line);margin:4px 4px}

.head,.job{display:grid;grid-template-columns:52px minmax(0,1fr) 170px 150px;gap:14px;align-items:center}
.head{padding:0 12px 6px;color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.head span:nth-child(3){text-align:right}
.list{display:flex;flex-direction:column;gap:8px}
.job{padding:12px;border-radius:18px;background:var(--glass-b);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);cursor:pointer;transition:.2s}
.job:hover{background:var(--glass-a)}
.ring{width:48px;height:48px;position:relative;display:grid;place-items:center;font-size:13px;font-weight:600}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ttl{font-weight:600;font-size:14.5px;letter-spacing:-.01em;line-height:1.3}
.meta{display:flex;gap:4px 10px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px;margin-top:3px}
.meta .co{color:var(--ink-2);font-weight:500}
.why{color:var(--ink-2);font-size:12.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--chip);font-size:11px;font-weight:500;color:var(--ink-2)}
.tag.debt{color:var(--debt);background:color-mix(in srgb,var(--debt) 13%,transparent)}
.tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pay{text-align:right}
.pay .amt{font-size:19px;font-weight:400;letter-spacing:-.02em;white-space:nowrap}
.pay .amt small{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-left:2px}
.pay .src{font-size:11px;color:var(--ink-3);margin-top:2px}
.pay .src.est{color:var(--warn)}
.pay .none{color:var(--ink-3);font-size:12.5px}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.acts .row{display:flex;justify-content:flex-end;gap:2px}
.note{margin-top:7px;padding:7px 10px;border-radius:11px;font-size:12px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--ink)}
.note.ok{background:color-mix(in srgb,var(--ok) 12%,transparent)}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13px;border-radius:16px;border:1px dashed var(--line)}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:4px}

/* drawer */
.dbg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .3s}
.drawer{position:fixed;z-index:21;top:14px;right:14px;bottom:14px;width:min(620px,calc(100vw - 28px));border-radius:26px;background:var(--drawer);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:var(--shadow),inset 0 1px 0 var(--rim);transform:translateX(calc(100% + 30px));transition:transform .45s cubic-bezier(.16,1,.3,1);overflow-y:auto;padding:26px}
.open .dbg{opacity:1;pointer-events:auto}
.open .drawer{transform:none}
.drawer h2{font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.25;padding-right:60px}
.drawer h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:500;margin:22px 0 8px}
.drawer p,.drawer li{font-size:13.5px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap}
.drawer ul{padding-left:18px}
.box{padding:14px 16px;border-radius:16px;background:var(--glass-b);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.split{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.mini{padding:12px 14px;border-radius:16px;background:var(--glass-b);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.mini .l{font-size:11.5px;color:var(--ink-3)}
.mini .v{font-size:18px;font-weight:400;letter-spacing:-.02em;margin-top:2px}
.dacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.close{position:absolute;top:18px;right:18px}

.log{margin-top:18px;padding:0}
.log summary{cursor:pointer;padding:16px 24px;font-size:13px;color:var(--ink-2);list-style:none;font-weight:500}
.log pre{font-family:"Geist Mono",monospace;font-size:11.5px;color:var(--ink-3);padding:0 24px 20px;white-space:pre-wrap;max-height:340px;overflow:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;z-index:30;padding:11px 18px;border-radius:14px;font-size:13px;transition:all .35s cubic-bezier(.16,1,.3,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){.span-3{grid-column:span 6}}
@media (max-width:860px){
  .head{display:none}
  .job{grid-template-columns:44px minmax(0,1fr) auto}
  .job .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
  .acts .row{justify-content:flex-start}
}
@media (max-width:760px){
  main{padding:14px 16px 96px}
  .rail{top:auto;left:16px;right:16px;bottom:14px;width:auto;height:62px;flex-direction:row;justify-content:space-around;padding:0 10px}
  .rail .logo,.rail .sp{display:none}
  .top{grid-template-columns:1fr;justify-items:center}
  .pill,.pill.tools{justify-self:center}
  .pill.tools{flex-wrap:wrap;justify-content:center}
  .hero .t{font-size:48px}
  .span-3{grid-column:span 12}
  .grid{gap:12px;margin-bottom:12px}
  .search{width:100%}
  .tools-row{width:100%}
  .split{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="scene"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="grain"></div></div>

<nav class="rail glass" id="rail">
  <div class="logo">J</div>
  <div id="railTabs" style="display:contents"></div>
  <div class="sp"></div>
  <button id="themeBtn" title="Light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</nav>

<main>
  <div class="top">
    <div class="pill glass"><span class="dot" id="dot"></span><span><b>Job Seeker</b> · <span id="status">Idle</span></span></div>
    <div class="hero"><div class="t num" id="heroNum">0<small>applied</small></div><div class="d" id="heroSub">Autopilot runs every morning at 9:00</div></div>
    <div class="pill glass tools">
      <button class="btn ghost" id="runBtn" title="Search all sources, write applications, apply">Find new jobs</button>
      <button class="btn" id="apBtn" title="Apply to everything in the queue now">Apply now</button>
      <button class="btn dark" id="batchBtn" title="Open the filled-in forms that need your tick">Open what needs me</button>
    </div>
  </div>

  <section class="grid" id="kpis"></section>

  <section class="glass card">
    <div class="card-h">
      <div><h2 id="listTitle">Jobs</h2><div class="sub" id="listSub"></div></div>
      <div class="tools-row"><input class="search" id="q" placeholder="Search role or company"></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="head"><span>Fit</span><span>Role</span><span>Salary / month</span><span></span></div>
    <div class="list" id="list"></div>
  </section>

  <details class="glass log" id="logBox"><summary>Activity log</summary><pre id="log"></pre></details>
</main>

<div id="drawerRoot"><div class="dbg" id="dbg"></div><aside class="drawer" id="drawer"></aside></div>
<div class="toast glass" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const api = (u, o = {}) => fetch(u, { ...o, headers: { 'Content-Type': 'application/json' }, body: o.body ? JSON.stringify(o.body) : undefined }).then((r) => r.json());
const root = document.documentElement;
const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let state = { jobs: [], running: [], tab: store.get('js-tab', 'needs'), family: 'All', sort: store.get('js-sort', 'fit'), q: '' };
const th = store.get('js-theme'); if (th) root.dataset.theme = th;

const I = {
  needs: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  ready: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  longshots: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  pipeline: '<path d="M3 4h18l-7 8v6l-4 2v-8z"/>',
  applied: '<path d="M20 6 9 17l-5-5"/>',
  skipped: '<path d="M5 12h14"/>',
};
const TABS = [
  ['needs', 'Needs you', (j) => j.status === 'ready', 'Filled-in forms waiting for your tick, and questions only you can answer.'],
  ['ready', 'Queued', (j) => j.status === 'tailored' && j.ai?.verdict !== 'skip' && (j.ai?.fit ?? 0) >= 45, 'Tailored and waiting for the autopilot.'],
  ['longshots', 'Long shots', (j) => j.status === 'tailored' && j.ai?.verdict !== 'skip' && (j.ai?.fit ?? 0) < 45, 'Under 45% fit. Only worth it when the pay is exceptional.'],
  ['pipeline', 'Pipeline', (j) => j.status === 'new', 'Matches the AI has not reviewed yet.'],
  ['applied', 'Applied', (j) => ['applied', 'interview', 'offer'].includes(j.status), 'Everything sent, newest first.'],
  ['skipped', 'Skipped', (j) => ['skipped', 'rejected', 'expired'].includes(j.status), 'Poor fits, closed or expired roles.'],
];
const AED = 3.6725;
const fitOf = (j) => j.ai?.fit ?? j.score;
const ago = (d) => { if (!d) return ''; const days = Math.floor((Date.now() - Date.parse(d)) / 864e5); return days <= 0 ? 'today' : `${days}d ago`; };
const k = (n) => (n >= 10000 ? `${Math.round(n / 1000)}k` : n.toLocaleString('en-US'));

// Salary in AED per month: listed when the posting gives it, AI market estimate otherwise.
function pay(j) {
  if (j.salaryUSD) return { min: (j.salaryUSD.min * AED) / 12, max: (j.salaryUSD.max * AED) / 12, kind: 'listed' };
  if (j.salaryEst) return { min: j.salaryEst.minAED, max: j.salaryEst.maxAED, kind: 'est', basis: j.salaryEst.basis };
  return null;
}
const payMid = (j) => { const s = pay(j); return s ? (s.min + s.max) / 2 : 0; };
const payText = (s) => `AED ${k(Math.round(s.min / 500) * 500)}${s.max - s.min > 600 ? `–${k(Math.round(s.max / 500) * 500)}` : ''}`;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600); }

function ring(v) {
  const r = 21, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, v)) / 100);
  const col = v >= 65 ? 'var(--ok)' : v >= 45 ? 'var(--accent-2)' : 'var(--ink-3)';
  return `<div class="ring num"><svg width="48" height="48"><circle cx="24" cy="24" r="${r}" stroke="var(--chip)" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="${r}" stroke="${col}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>${v}</div>`;
}

function kpi(label, icon, value, unit, foot) {
  return `<div class="glass kpi span-3"><div class="lbl"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icon}</svg></i>${label}</div><div class="v num">${value}${unit ? `<small>${unit}</small>` : ''}</div><div class="foot">${foot}</div></div>`;
}

function render() {
  const all = state.jobs;
  const count = (f) => all.filter(f).length;
  const today = new Date().toISOString().slice(0, 10);
  const applied = count((j) => ['applied', 'interview', 'offer'].includes(j.status));
  const appliedToday = count((j) => (j.appliedAt || '').startsWith(today));
  const needs = all.filter(TABS[0][2]);
  const ticks = needs.filter((j) => j.autopilot?.handoff).length;
  const queued = all.filter(TABS[1][2]);
  const paid = queued.concat(needs).filter((j) => pay(j));
  const avg = paid.length ? paid.reduce((s, j) => s + payMid(j), 0) / paid.length : 0;
  const top = paid.sort((a, b) => payMid(b) - payMid(a))[0];

  $('#heroNum').innerHTML = `${applied}<small>applied</small>`;
  $('#heroSub').textContent = appliedToday ? `${appliedToday} sent today · runs every morning at 9:00` : 'Autopilot runs every morning at 9:00';
  $('#kpis').innerHTML = [
    kpi('Needs you', I.needs, needs.length, '', ticks ? `${ticks} only need a tick and Submit` : needs.length ? 'Each needs one answer from you' : 'Nothing waiting on you'),
    kpi('Queued', I.ready, queued.length, '', 'Tailored, next in line for the autopilot'),
    kpi('Average pay', '<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>', avg ? `AED ${k(Math.round(avg / 500) * 500)}` : '–', '/mo', 'Across queued and waiting jobs'),
    kpi('Top offer', '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>', top ? payText(pay(top)) : '–', top ? '/mo' : '', top ? `${esc(top.company)} · ${pay(top).kind === 'est' ? 'estimate' : 'listed'}` : 'No pay data yet'),
  ].join('');

  $('#railTabs').innerHTML = TABS.map(([key, label, f]) => {
    const n = count(f);
    return `<button class="${state.tab === key ? 'on' : ''}" data-tab="${key}" title="${label}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[key]}</svg>${n ? `<span class="badge ${key === 'needs' ? '' : 'n'} num">${n > 99 ? '99+' : n}</span>` : ''}</button>`;
  }).join('');

  const tab = TABS.find((t) => t[0] === state.tab) || TABS[0];
  const inTab = all.filter(tab[2]);
  $('#listTitle').textContent = tab[1];
  $('#listSub').textContent = `${inTab.length} jobs · ${tab[3]}`;
  const fams = ['All', ...new Set(inTab.map((j) => j.family).filter(Boolean))];
  if (!fams.includes(state.family)) state.family = 'All';
  $('#chips').innerHTML = fams.map((f) => `<button class="chip ${state.family === f ? 'on' : ''}" data-fam="${esc(f)}">${esc(f)}</button>`).join('')
    + `<span class="sep"></span>` + [['fit', 'Best fit'], ['pay', 'Highest pay'], ['new', 'Newest']].map(([s, l]) => `<button class="chip ${state.sort === s ? 'on' : ''}" data-sort="${s}">${l}</button>`).join('');

  const q = state.q.toLowerCase();
  const sorters = { fit: (a, b) => fitOf(b) - fitOf(a), pay: (a, b) => payMid(b) - payMid(a), new: (a, b) => Date.parse(b.postedAt || 0) - Date.parse(a.postedAt || 0) };
  const rows = inTab
    .filter((j) => state.family === 'All' || j.family === state.family)
    .filter((j) => !q || `${j.title} ${j.company}`.toLowerCase().includes(q))
    .sort(state.tab === 'applied' && state.sort === 'fit' ? (a, b) => Date.parse(b.appliedAt || 0) - Date.parse(a.appliedAt || 0) : sorters[state.sort]);

  $('#batchBtn').disabled = !needs.length;
  if (!rows.length) {
    $('#list').innerHTML = `<div class="empty"><b>Nothing here</b>${esc(tab[3])}</div>`;
    return;
  }
  $('#list').innerHTML = rows.map(row).join('');
}

function row(j) {
  const ai = j.ai || {};
  const s = pay(j);
  const tailored = !!j.files?.cv;
  const done = ['applied', 'interview', 'offer'].includes(j.status);
  let note = '';
  if (j.status === 'ready' && j.autopilot?.handoff) note = `<div class="note ok">Filled in and ready. Tick "Verify you are human" and press Submit.</div>`;
  else if (j.skipReason && j.status === 'skipped') note = `<div class="note">${esc(j.skipReason)}</div>`;
  else if (j.status === 'ready' && j.autopilot?.why) note = `<div class="note">${esc(j.autopilot.why)}${j.autopilot.todo?.length ? ': ' + esc(j.autopilot.todo.slice(0, 3).join(' · ')) : ''}</div>`;
  return `<article class="job" data-id="${j.id}">
    ${ring(fitOf(j))}
    <div>
      <div class="ttl">${esc(j.title)}</div>
      <div class="meta"><span class="co">${esc(j.company)}</span><span>${esc(j.locationLabel || j.location)}</span><span>${ago(j.postedAt)}</span></div>
      ${ai.reason ? `<div class="why">${esc(ai.reason)}</div>` : ''}
      ${note}
      <div class="tags">${ai.verdict ? `<span class="tag ${ai.verdict === 'apply' ? 'ok' : ai.verdict === 'maybe' ? 'warn' : 'debt'}">${ai.verdict}</span>` : ''}${j.family ? `<span class="tag">${esc(j.family)}</span>` : ''}${j.appliedVia === 'autopilot' ? '<span class="tag ok">Auto-applied</span>' : ''}${done ? `<span class="tag ok">Applied ${ago(j.appliedAt)}</span>` : ''}</div>
    </div>
    <div class="pay">${s ? `<div class="amt num">${payText(s)}<small>/mo</small></div><div class="src ${s.kind}">${s.kind === 'listed' ? 'Listed in the post' : 'Market estimate'}</div>` : '<div class="none">Not listed</div>'}</div>
    <div class="acts">
      ${tailored && !done ? `<button class="btn dark" data-act="apply" data-id="${j.id}">${j.autopilot?.handoff ? 'Finish' : 'Open'}</button>` : ''}
      ${!tailored && j.status === 'new' ? `<button class="btn" data-act="tailor" data-id="${j.id}">Write application</button>` : ''}
      ${j.status === 'applied' ? `<button class="btn" data-act="interview" data-id="${j.id}">Got interview</button>` : ''}
      <div class="row">
        <a class="btn ghost" href="${esc(j.url)}" target="_blank" rel="noopener">Post</a>
        ${tailored ? `<a class="btn ghost" href="/file?path=${encodeURIComponent(j.files.cv)}" target="_blank">CV</a>` : ''}
        ${done || j.status === 'skipped' ? '' : `<button class="btn ghost" data-act="skip" data-id="${j.id}">Skip</button>`}
      </div>
    </div>
  </article>`;
}

async function openDrawer(id) {
  const j = await api(`/api/job/${id}`);
  if (!j) return;
  const ai = j.ai || {};
  const s = pay(j);
  $('#drawer').innerHTML = `
    <button class="btn ghost close" id="closeDrawer">Close</button>
    <div class="meta" style="margin-bottom:8px"><span class="co">${esc(j.company)}</span><span>${esc(j.locationLabel || j.location)}</span></div>
    <h2>${esc(j.title)}</h2>
    <div class="split">
      <div class="mini"><div class="l">Salary / month</div><div class="v num">${s ? payText(s) : '–'}</div><div class="l">${s ? (s.kind === 'listed' ? 'Listed in the post' : 'Market estimate') : 'Not listed'}</div></div>
      <div class="mini"><div class="l">AI fit</div><div class="v num">${fitOf(j)}%</div><div class="l">${esc(ai.verdict || 'not reviewed')}</div></div>
      <div class="mini"><div class="l">Posted</div><div class="v">${ago(j.postedAt) || '–'}</div><div class="l">${esc(j.source)}</div></div>
    </div>
    <div class="dacts">
      ${j.files?.cv && !['applied', 'interview', 'offer'].includes(j.status) ? `<button class="btn dark" data-act="apply" data-id="${j.id}">Open filled-in form</button>` : ''}
      ${!j.files?.cv ? `<button class="btn" data-act="tailor" data-id="${j.id}">Write application</button>` : ''}
      ${j.status !== 'applied' ? `<button class="btn" data-act="applied" data-id="${j.id}">Mark applied</button>` : ''}
      ${j.files?.dir ? `<button class="btn" data-act="folder" data-id="${j.id}">Open folder</button>` : ''}
      <a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener">View posting</a>
    </div>
    ${s?.basis ? `<h3>Salary estimate based on</h3><p>${esc(s.basis)}</p>` : ''}
    ${ai.reason ? `<h3>Why it fits</h3><p>${esc(ai.reason)}</p>` : ''}
    ${ai.risks ? `<h3>Risks</h3><p>${esc(ai.risks)}</p>` : ''}
    ${j.autopilot?.why ? `<h3>Autopilot</h3><p>${esc(j.autopilot.why)}${j.autopilot.todo?.length ? '\n· ' + esc(j.autopilot.todo.join('\n· ')) : ''}</p>` : ''}
    ${ai.coverLetter ? `<h3>Cover letter</h3><div class="box"><p>${esc(ai.coverLetter)}</p></div><div class="dacts"><button class="btn" id="copyLetter">Copy letter</button>${j.files?.letter ? `<a class="btn ghost" target="_blank" href="/file?path=${encodeURIComponent(j.files.letter)}">PDF</a>` : ''}</div>` : ''}
    ${ai.headline ? `<h3>Tailored CV</h3><p><b style="color:var(--ink)">${esc(ai.headline)}</b></p><ul>${(ai.bullets || []).map((b) => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
    <h3>Posting</h3><p>${esc((j.description || '').slice(0, 5000))}</p>`;
  $('#copyLetter')?.addEventListener('click', async () => { await navigator.clipboard.writeText(ai.coverLetter); toast('Cover letter copied'); });
  $('#closeDrawer').onclick = closeDrawer;
  $('#drawerRoot').classList.add('open');
}
const closeDrawer = () => $('#drawerRoot').classList.remove('open');

async function act(kind, id) {
  if (kind === 'apply') { await api('/api/apply', { method: 'POST', body: { ids: [id] } }); toast('Opening the filled-in form in Edge'); }
  if (kind === 'tailor') { const r = await api('/api/tailor', { method: 'POST', body: { ids: [id] } }); toast(r.ok ? 'Writing the application, about a minute' : 'Already writing applications'); }
  if (kind === 'skip') { await api(`/api/job/${id}/status`, { method: 'POST', body: { status: 'skipped' } }); toast('Skipped'); }
  if (kind === 'applied') { await api(`/api/job/${id}/status`, { method: 'POST', body: { status: 'applied' } }); toast('Marked as applied'); }
  if (kind === 'interview') { await api(`/api/job/${id}/status`, { method: 'POST', body: { status: 'interview' } }); toast('Moved to interviews'); }
  if (kind === 'folder') await api(`/api/job/${id}/folder`, { method: 'POST' });
  load();
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a) { e.stopPropagation(); return act(a.dataset.act, a.dataset.id); }
  const t = e.target.closest('[data-tab]');
  if (t) { state.tab = t.dataset.tab; store.set('js-tab', state.tab); return render(); }
  const f = e.target.closest('[data-fam]');
  if (f) { state.family = f.dataset.fam; return render(); }
  const so = e.target.closest('[data-sort]');
  if (so) { state.sort = so.dataset.sort; store.set('js-sort', state.sort); return render(); }
  if (e.target.closest('a, .acts')) return;
  const c = e.target.closest('.job');
  if (c) openDrawer(c.dataset.id);
});
document.addEventListener('pointermove', (e) => {
  const g = e.target.closest?.('.glass');
  if (!g) return;
  const r = g.getBoundingClientRect();
  g.style.setProperty('--mx', `${e.clientX - r.left}px`);
  g.style.setProperty('--my', `${e.clientY - r.top}px`);
});
$('#dbg').onclick = closeDrawer;
document.addEventListener('keydown', (e) => e.key === 'Escape' && closeDrawer());
$('#q').oninput = (e) => { state.q = e.target.value; render(); };
$('#themeBtn').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  store.set('js-theme', root.dataset.theme);
};
$('#runBtn').onclick = async () => { const r = await api('/api/run', { method: 'POST' }); toast(r.ok ? 'Finding jobs, writing applications and applying' : 'Already running'); load(); };
$('#apBtn').onclick = async () => { const r = await api('/api/autopilot', { method: 'POST' }); toast(r.ok ? 'Applying to the queue in the background' : 'Already applying'); load(); };
$('#batchBtn').onclick = async () => {
  const ids = state.jobs.filter(TABS[0][2]).sort((a, b) => (b.autopilot?.handoff ? 1 : 0) - (a.autopilot?.handoff ? 1 : 0) || fitOf(b) - fitOf(a)).slice(0, 8).map((j) => j.id);
  if (!ids.length) return toast('Nothing needs you right now');
  await api('/api/apply', { method: 'POST', body: { ids } });
  toast(`Opening ${ids.length} filled-in forms in Edge`);
};

async function load() {
  const d = await api('/api/jobs').catch(() => null);
  if (!d) return;
  state.jobs = d.jobs; state.running = d.running;
  const busy = d.running.filter((r) => !r.startsWith('apply-'));
  $('#dot').classList.toggle('on', busy.length > 0);
  $('#status').textContent = busy.length ? (busy.includes('daily') ? 'Finding and applying' : busy.includes('autopilot') ? 'Applying' : 'Writing applications') : d.lastRun ? `Last run ${ago(d.lastRun.finished)}` : 'Idle';
  render();
  if ($('#logBox').open) $('#log').textContent = (await api('/api/log')).lines.join('\n');
}
$('#logBox').addEventListener('toggle', load);
load();
setInterval(load, 6000);
</script>
</body>
</html>
